name: Build HURO VISUAL

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod
        working-directory: mod
        run: gradle build --no-daemon

      - name: Put mod inside launcher
        shell: bash
        run: |
          mkdir -p launcher/src/main/resources
          cp mod/build/libs/huro-visual-1.0.0.jar launcher/src/main/resources/huro-visual.jar

      - name: Build launcher
        working-directory: launcher
        run: gradle jar --no-daemon

      - name: Make Windows app with built-in Java
        shell: pwsh
        run: |
          jpackage --type app-image --name "HURO Launcher" --app-version 1.0.0 
            --input launcher/build/libs --main-jar HuroLauncher.jar --main-class huro.HuroLauncher 
            --add-modules java.base,java.desktop,java.logging,java.net.http,java.xml,java.naming,java.prefs,java.sql,java.management,jdk.crypto.ec,jdk.zipfs,jdk.unsupported `
            --dest dist
          Compress-Archive -Path "dist/HURO Launcher" -DestinationPath "dist/HURO-Launcher-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HURO-Launcher-Windows
          path: dist/HURO-Launcher-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HURO-VISUAL-mod
          path: mod/build/libs/huro-visual-1.0.0.jar
